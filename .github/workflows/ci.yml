name: CI

on:
  push:
    branches:
      - main
      - 'v2026.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        find-data-mode: [mock, disconnected, http]
    env:
      VITE_FIND_DATA_MODE: ${{ matrix.find-data-mode }}
      VITE_FIND_DATA_API_BASE: /api/find-data
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
